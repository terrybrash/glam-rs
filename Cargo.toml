[package]
name = "glam"
version = "0.33.2" # remember to update html_root_url
edition = "2021"
description = "A simple and fast 3D math library for games and graphics"
repository = "https://github.com/bitshifter/glam-rs"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["gamedev", "math", "matrix", "vector", "quaternion"]
categories = ["game-engines", "no-std"]
rust-version = "1.96.0"

[badges]
maintenance = { status = "actively-developed" }

# docs.rs builds on nightly, so `doc_auto_cfg` can annotate feature-gated items there without
# requiring nightly for ordinary builds. Features are listed explicitly rather than using
# `all-features`, which would enable the non-default `scalar-math` and
# misrepresent the shipped API.
[package.metadata.docs.rs]
features = [
    "all-types",
    "approx",
    "bytemuck",
    "mint",
    "rand",
    "serde",
    "rkyv",
    "zerocopy",
]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all-types"]

f64 = []
i64 = []
u64 = []
i32 = []
u32 = []
i16 = []
u16 = []
i8 = []
u8 = []

float-types = ["f64"]
integer-types = ["i8", "u8", "i16", "u16", "i32", "u32", "i64", "u64"]
all-types = ["float-types", "integer-types"]

# enable additional glam checks if debug assertions are enabled
debug-glam-assert = []
# always enable additional glam checks
glam-assert = []

# Builds the scalar reference implementation instead of SSE2 or NEON. This is a
# test reference only; do not ship it. The differential test in
# `tests/golden_bits.rs` uses it to tell which SIMD backend is wrong when the
# two disagree. See rewrite.md.
scalar-math = []

serde = ["dep:serde_core"]

bytecheck = ["rkyv/bytecheck"]

zerocopy = ["dep:zerocopy", "dep:zerocopy-derive"]

[dependencies]
approx = { version = "0.5", optional = true, default-features = false }
bytemuck = { version = "1.9", optional = true, default-features = false, features = ["derive", "aarch64_simd", "wasm_simd"] }
mint = { version = "0.5.8", optional = true, default-features = false }
rand = { version = "0.10", optional = true, default-features = false }
serde_core = { version = "1.0", optional = true, default-features = false }
rkyv = { version = "0.8", optional = true, default-features = false }
# Pinned exactly. The transcendental functions must not change between builds,
# so raise this deliberately and re-run the bit-pattern tests. See rewrite.md.
libm = { version = "=0.2.16", default-features = false }
speedy = { version = "0.8", optional = true, default-features = false }
encase = { version = "0.12", optional = true, default-features = false }
zerocopy = { version = "0.8", optional = true, default-features = false, features = ["simd"] }
zerocopy-derive = { version = "0.8", optional = true, default-features = false }
arbitrary = { version = "1.4.2", default-features = false, optional = true }

[dev-dependencies]
# rand_xoshiro is required for tests if rand is enabled
rand_xoshiro = "0.8"
# "alloc" is needed to support to_bytes()/deserialize() in tests.
rkyv = { version = "0.8", default-features = false, features = ["alloc"] }
serde_json = "1.0"

criterion = { version = "0.8", features = ["html_reports"] }
gungraun = "0.19"

[lib]
bench = false

[[bench]]
name = "mat2"
harness = false

[[bench]]
name = "mat3"
harness = false

[[bench]]
name = "mat3a"
harness = false

[[bench]]
name = "affine2"
harness = false

[[bench]]
name = "affine3"
harness = false

[[bench]]
name = "mat4"
harness = false

[[bench]]
name = "quat"
harness = false

[[bench]]
name = "support"
bench = false

[[bench]]
name = "vec2"
harness = false

[[bench]]
name = "vec3"
harness = false

[[bench]]
name = "vec3a"
harness = false

[[bench]]
name = "vec4"
harness = false

[[bench]]
name = "gungraun"
harness = false

[workspace]
members = [
    "tools/ci",
    "tools/codegen",
]
