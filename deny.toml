[bans]
multiple-versions = "deny"
# Dependencies that would break determinism. rewrite.md requires one code path,
# no processor feature tests at run time, and no fast-math builds. Examine any
# new maths or physics dependency before you add it: look for approximate
# reciprocal instructions, fast-math flags, and changes to MXCSR or FPCR.
deny = [
    # Chooses an instruction set while the program runs.
    { name = "multiversion" },
    # Has runtime-dispatch paths and approximate reciprocals.
    { name = "simdeez" },
]
skip-tree = [
    # ignore criterion dev-dependency that often have duplicate dependencies internally
    { name = "criterion" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
# ignoring bincode unmaintained advisory as it's a dependency of a dev-dependency it's low risk to users.
ignore = [
    "RUSTSEC-2025-0141"
]
