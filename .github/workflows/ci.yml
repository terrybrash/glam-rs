name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job uses the compiler pinned in rust-toolchain.toml. Do not add a
# toolchain matrix, and do not call `rustup default`. One compiler gives one
# floating-point operation order on every machine, and that is what makes the
# results the same. See rewrite.md.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p ci -- lints

  # The gate. The same stored bit patterns must hold on x86-64 and on ARM. If a
  # backend, the compiler, or a dependency changes a result, this job fails.
  determinism:
    name: Determinism (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64, os: ubuntu-latest }
          - { name: windows x86-64, os: windows-latest }
          - { name: macos x86-64, os: macos-13 }
          - { name: macos ARM, os: macos-latest }
          - { name: linux ARM, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Fails on any instruction or function that rewrite.md does not permit.
      - run: cargo test --release --test forbidden
      # The stored bit patterns, for the shipped backends and for the reference.
      - run: cargo test --release --test golden_bits
      - run: cargo test --release --features scalar-math --test golden_bits
      - run: cargo test --release

  features:
    name: Test features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p ci -- test-features

  # Rejects a dependency that would break determinism. See deny.toml.
  deny:
    name: Check dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
